<div class="container" fxLayout="row" fxLayoutAlign="start stretch" fxFlexFill>
  <div class="image-box" fxFlex="70" fxFlexFill>
    <img
    [src]="'../../assets/images/logo.jpg'"
    class="responsive-image"
    alt="App Logo"/>
  </div>
  <div class="login-box" fxFlex="30" fxLayout="column" fxLayoutAlign="center center" fxFlexFill>
    <div class="login-container" fxLayout="column" fxLayoutAlign="start center" fxLayoutGap="7.5px" fxFlexFill>
      <h2>Register</h2>
      <form action="#" [formGroup]="registerForm" (ngSubmit)="onSubmit()" fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="7.5px">
        <mat-form-field appearance="fill" class="full-width" hideRequiredMarker="true">
          <mat-label>Name</mat-label>
          <input matInput type="text" formControlName="name" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" hideRequiredMarker="true">
          <mat-label>Surname</mat-label>
          <input matInput type="text" formControlName="surname" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" hideRequiredMarker="true">
          <mat-label>Username</mat-label>
          <input matInput type="text" formControlName="username" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" hideRequiredMarker="true">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" autocomplete="email" formControlName="email" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" hideRequiredMarker="true">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            formControlName="password"
            required
            autocomplete="current-password">
          <button
            mat-icon-button
            matSuffix
            (click)="hide = !hide"
            [attr.aria-label]="'Toggle password visibility'"
            [attr.aria-pressed]="hide"
            type="button"
            style="transform: translate(0px, -3px);">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width" hideRequiredMarker="true">
          <mat-label>Confirm</mat-label>
          <input
            matInput
            [type]="confirmHide ? 'password' : 'text'"
            required
            autocomplete="current-password"
            formControlName="password2"
            (input)="checkPasswordsMatch()">
          <button
            mat-icon-button
            matSuffix
            (click)="confirmHide = !confirmHide"
            [attr.aria-label]="'Toggle password visibility'"
            [attr.aria-pressed]="confirmHide"
            type="button"
            style="transform: translate(0px, -3px);">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <button
          mat-icon-button
          matSuffix
          disabled
          type="button"
          style="transform: translate(0px, -3px);">
          <mat-icon [ngStyle]="{'color': passwordsMatch ? 'green' : 'red'}">
            {{ passwordsMatch ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </button>
        </mat-form-field>

        <div fxLayout="column" fxLayoutAlign="start start" style="width: 80%;">
          <label for="regionSelect" style="font-weight: 600;">Select Country</label>
          <div class="select-wrapper">
            <select name="region" id="regionSelect" formControlName="country">
              <option value="greece">Greece</option>
            </select>
            <i class="bi bi-eject-fill select-icon"></i>
          </div>
        </div>

        <div fxLayout="column" fxLayoutAlign="start start" style="width: 80%;">
          <label for="regionSelect" style="font-weight: 600;">Select Region</label>
          <div class="select-wrapper">
            <select name="region" id="regionSelect" formControlName="region">
              <option value="Central_Greece">Central Greece</option>
              <option value="Macedonia">Macedonia</option>
              <option value="Crete">Crete</option>
              <option value="Thrace">Thrace</option>
            </select>
            <i class="bi bi-eject-fill select-icon"></i>
          </div>
        </div>

        <div fxLayout="column" fxLayoutAlign="start start" style="width: 80%;">
          <label for="regionSelect" style="font-weight: 600;">Select Role</label>
          <div class="select-wrapper">
            <select name="role" id="regionSelect" formControlName="role">
              <option value="visitor">Traveler</option>
              <option value="guide">Guide</option>
            </select>
            <i class="bi bi-eject-fill select-icon"></i>
          </div>
        </div>

        <button mat-raised-button type="submit" class="profile-button lgn" [disabled]="registerForm.disabled || registerForm.invalid">Sign up</button>

        <button mat-raised-button type="button" class="profile-button rgs" (click)="goBack()">Back</button>

      </form>
    </div>
  </div>
</div>

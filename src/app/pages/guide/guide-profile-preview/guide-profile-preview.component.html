<div fxLayout="column" fxLayoutAlign="start start" fxLayoutGap="30px"  *ngIf="formReady">
  <div class="container" fxLayout="column" fxLayoutAlign="space-evenly center" fxLayoutGap="30px" fxFlex>
    <div class="details-box" fxLayout="row" fxLayoutAlign="start start" fxFlex="20" fxFill fxLayoutGap="30px">
      <div class="avatar-box" fxLayout="column" fxLayoutAlign="start start" fxFlex="10" fxFill>
        <img [src]="profilePic64 || '../../assets/images/user.png'" alt="Guide Profile" class="responsive-image">
      </div>
      <div class="profile-box" fxLayout="column" fxLayoutAlign="start start" fxFlex="60" fxFill fxLayoutGap="10px">
        <span class="username">&#64;{{username}}</span>
        <span class="fullname">{{fullName}}</span>
        <div fxLayout="row" fxLayoutAlign="start start" fxFill fxLayoutGap="10px" class="rating-box">
          <app-star-rating [rating]="rating" [readonly]="true"></app-star-rating>
          <span class="username">({{total}})</span>
        </div>
      </div>
      <div fxLayout="column" fxLayoutAlign="start start" fxLayoutGap="30px">
        <div class="region-box" fxLayout="column" fxLayoutAlign="start start" fxFlex="25" fxFill>
          <div fxLayout="row" fxLayoutAlign="end start" fxFill fxLayoutGap="10px">
            <i class="bi bi-pin-map-fill no-bookings"></i>
            <span class="username">{{region}}</span>
          </div>
        </div>

        <div class="region-box" fxLayout="column" fxLayoutAlign="start start" fxFlex="25" fxFill>
          <div fxLayout="row" fxLayoutAlign="end start" fxFill fxLayoutGap="10px">
            <i class="bi bi-instagram no-bookings"></i>
            <span class="username insta" (click)="openInstagramProfile()">{{instagram}}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="media-box" fxLayout="column" fxLayoutAlign="start start" fxFlex="70" fxLayoutGap="20px" fxFill>

      <div class="large-box" fxLayout="row" fxLayoutAlign="start start" fxFlex="70" fxLayoutGap="20px" fxFill>

        <!-- Large Image -->
        <div class="large-image" fxLayout="row" fxLayoutAlign="start start" fxFlex="70" [ngClass]="mediaFiles[0] ? 'custom-image-class' : 'fallback-image-class'">
          <img
            [src]="mediaFiles[0] ? mediaFiles[0].media_data : '../../assets/images/mountain.png'"
            alt="Large Image"
            class="responsive-image"
            style="max-height: 380px;"
          />
        </div>

        <!-- Medium Box -->
        <div class="medium-box" fxLayout="column" fxLayoutAlign="start start" fxFlex="30" fxFill fxLayoutGap="20px">

          <div class="medium-image" fxLayout="column" fxLayoutAlign="center center" fxFlex="50" [ngClass]="mediaFiles[1] ? 'custom-image-class' : 'fallback-image-class'">
            <img
              [src]="mediaFiles[1] ? mediaFiles[1].media_data : '../../assets/images/mountain.png'"
              alt="Medium Image 1"
              class="responsive-image"
              [ngStyle]="{'max-height': mediaFiles[1] ? '170px' : '150px'}"
              style="width: 100%!important"
            />
          </div>

          <div class="medium-image" fxLayout="column" fxLayoutAlign="center center" fxFlex="50" [ngClass]="mediaFiles[2] ? 'custom-image-class' : 'fallback-image-class'">
            <img
              [src]="mediaFiles[2] ? mediaFiles[2].media_data : '../../assets/images/mountain.png'"
              alt="Medium Image 2"
              class="responsive-image"
              [ngStyle]="{'max-height': mediaFiles[2] ? '170px' : '150px'}"
              style="width: 100%!important"
            />
          </div>
        </div>
      </div>

      <!-- SMALL BOX -->
      <div class="small-box" fxLayout="row" fxLayoutAlign="start start" fxLayoutGap="25px">

        <ng-container *ngFor="let img of mediaFiles.slice(3, 7)">
          <div class="small-image" fxLayout="column" fxLayoutAlign="start start" fxFlex="17.5" [ngClass]="img ? 'custom-image-class' : 'fallback-image-class'">
            <img
              [src]="img.media_data || '../../assets/images/mountain.png'"
              class="responsive-sm-image"
              [ngClass]="img ? 'custom-image-height' : 'fallback-image-height'"
              style="width: 100%!important;"
            />
          </div>
        </ng-container>

        <ng-container *ngFor="let dummy of [].constructor(4 - mediaFiles.slice(3, 7).length)">
          <div class="small-image" fxLayout="column" fxLayoutAlign="center center" fxFlex="17.5">
            <img
              src="../../assets/images/mountain.png"
              class="responsive-sm-image"
              style="width: 100%!important;max-height: 85px;"
            />
          </div>
        </ng-container>

        <!-- See All button -->
        <div class="seeall" fxLayout="column" fxLayoutAlign="center center" fxFlex="15">
          <button mat-raised-button class="profile-button" (click)="openGallery()">
            <span class="date-label label-full">See All</span>
            <span class="date-label label-short">All</span>
          </button>
        </div>

      </div>

    </div>

    <div class="description-box" fxLayout="row" fxLayoutAlign="start start">
      <pre>{{description}}</pre>
    </div>
  </div>
  <div class="container" fxLayout="column" fxLayoutAlign="space-evenly center" fxLayoutGap="30px" fxFlex style="margin-top: 22px;">
    <app-availability [background]="'transparent'" [id]="selectedUser.id"></app-availability>
  </div>

  <div class="container" fxLayout="column" fxLayoutAlign="start start" fxLayoutGap="30px" style="margin-top: 22px;">
    <span class="title">Reviews</span>

      <div class="review-container-wrapper" *ngIf="!!reviews?.length">
        <div
          class="review-container"
          *ngFor="let review of reviews"
          fxLayout="row"
          fxLayoutAlign="space-around center">
          <div
            class="review-box"
            fxLayout="column"
            fxLayoutAlign="space-between start"
            fxFlex="80"
            fxLayoutGap="30px"
          >
            <p class="username">{{ review.username }}</p>
            <p class="comment">{{ review.comment }}</p>
          </div>
          <div
            class="review-box"
            fxLayout="column"
            fxLayoutAlign="space-between end"
            fxFlex="20"
          >
            <app-star-rating [rating]="review.rate" [readonly]="true"></app-star-rating>
            <p class="comment" id="review-at">
              {{ review.reviewed_at ? (review.reviewed_at | date: 'mediumDate') : (today | date: 'mediumDate') }}
            </p>
          </div>
        </div>
      </div>
  </div>

</div>

<div fxLayout="row" class="non-container" fxLayoutAlign="start start" fxLayoutGap="30px" *ngIf="!formReady">
  <div fxLayout="row" fxLayoutAlign="center center" fxFlex style="height: 100vh;">
    <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
      <span class="loading-text">Loading...</span>
      <div class="spinner"></div>
    </div>
  </div>
</div>

<div class="container" *ngIf="formReady">
  <!-- LEFT COLUMN -->
  <div class="left-column">
    <div class="card avatar">
      <div class="author">
        <img class="avatar" src="assets/images/user.png" alt="Profile">
        <h5 class="title">{{selectedUser.name}} {{selectedUser.surname}}</h5>
        <p class="description">{{selectedUser.username}}</p>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-column" *ngIf="formReady">
    <div class="card">
      <h4>Edit Profile</h4>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="form-group" style="margin-top: 15px;">
          <label>Username</label>
          <input type="text" formControlName="username">
        </div>

        <div class="form-group">
          <label>First Name</label>
          <input type="text"  formControlName="name">
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input type="text" formControlName="surname">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" autocomplete="email" formControlName="email">
        </div>

        <div class="form-group password-group">
          <label>Change Password</label>
          <div class="input-container">
            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              autocomplete="current-password"
              formControlName="password"
            >
            <span class="toggle-password" (click)="togglePasswordVisibility()">
              <i class="fas" [ngClass]="isPasswordVisible ? 'fa-eye' : 'fa-eye-slash'"></i>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label>Role</label>
          <input type="text" formControlName="role">
        </div>

        <div class="form-group">
          <label>Country</label>
          <select formControlName="country">
            <option value="Greece" selected>Greece</option>
          </select>
        </div>

        <div class="form-group">
          <label>Region</label>
          <select formControlName="region">
            <option *ngFor="let region of regions" [value]="region.value">
              {{ region.viewValue }}
            </option>
          </select>
        </div>

        <!-- <div class="form-group">
          <label>About Me</label>
          <textarea>Oh so, your weak rhyme You doubt I'll bother, reading into it</textarea>
        </div> -->

        <button type="submit" [disabled]="profileForm.disabled || profileForm.invalid">Update Profile</button>
      </form>
    </div>
  </div>
</div>

<div class="container" *ngIf="formReady">
  <!-- LEFT COLUMN -->
  <div class="left-column">

    <app-media></app-media>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-column" *ngIf="formReady">
    <div class="card">
      <h4>Edit Profile</h4>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" style="margin-top: 28px;">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="20px">
          <div class="form-group" style="margin-top: 15px;" fxFlex="50">
            <label>Username</label>
            <input type="text" formControlName="username">
          </div>

          <div class="form-group" fxFlex="50">
            <label>Role</label>
            <input type="text" formControlName="role">
          </div>

        </div>

        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="20px">

          <div class="form-group" fxFlex="50">
            <label>First Name</label>
            <input type="text"  formControlName="name">
          </div>

          <div class="form-group" fxFlex="50">
            <label>Last Name</label>
            <input type="text" formControlName="surname">
          </div>

        </div>

        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="20px">
          <div class="form-group" fxFlex="50">
            <label>Email</label>
            <input type="email" autocomplete="email" formControlName="email">
          </div>
        </div>

        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="20px">
          <div class="form-group password-group" fxFlex="50">
            <label>Change Password</label>
            <div class="input-container">
              <input
                [type]="isPasswordVisible ? 'text' : 'password'"
                autocomplete="current-password"
                formControlName="password">
              <span class="toggle-password" (click)="togglePasswordVisibility()">
                <i class="fas" [ngClass]="isPasswordVisible ? 'fa-eye' : 'fa-eye-slash'"></i>
              </span>
            </div>
          </div>
        </div>

        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="20px">
          <div class="form-group" fxFlex="50">
            <label>Country</label>
            <select formControlName="country">
              <option value="Greece" selected>Greece</option>
            </select>
          </div>
          <div class="form-group" fxFlex="50">
            <label>Region</label>
            <select formControlName="region">
              <option *ngFor="let region of regions" [value]="region.value">
                {{ region.viewValue }}
              </option>
            </select>
          </div>

        </div>

        <button type="submit" [disabled]="profileForm.disabled || profileForm.invalid">Update Profile</button>
      </form>
    </div>
  </div>
</div>

<div class="star-rating" [ngStyle]="{ 'font-size': fontSize }">
  <ng-container *ngFor="let star of starArray">
    <i
      style="margin-right: 5px;"
      class="stardom"
      [ngClass]="{
        'bi bi-star-fill': star === 'full',
        'bi bi-star-half': star === 'half',
        'bi bi-star': star === 'empty'
      }"
    ></i>
  </ng-container>
</div>

<div class="star-rating" [ngStyle]="{ 'font-size': fontSize }">
  <ng-container *ngFor="let star of starArray">
    <i
      class="fa"
      [ngClass]="{
        'fa-solid fa-star': getStarType(star) === 'full',
        'fa-solid fa-star-half-stroke': getStarType(star) === 'half',
        'fa-regular fa-star': getStarType(star) === 'empty'
      }"
    ></i>
  </ng-container>
</div>
